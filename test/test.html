<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Рівень</title>
    <link rel="stylesheet" href="test.css">
</head>
<body>

<div class="exercise styled">

    <div class="level-head">
        <button class="back-btn" id="back-btn">← Карта</button>
        <span class="level-title" id="level-title"></span>
        <span class="counter" id="counter"></span>
    </div>

    <div class="question styled" id="question"></div>

    <div class="answers" id="answers"></div>

    <div class="explanation hidden" id="explanation"></div>

    <button class="next-btn" id="next-btn" disabled>Далі →</button>

    <!-- Екран результату. Показується поверх усього після 5-го питання. -->
    <div class="result hidden" id="result">
        <div class="stars" id="stars"></div>
        <p class="score" id="score"></p>
        <p class="verdict" id="verdict"></p>
        <p class="save-state" id="save-state"></p>
        <div class="result-actions">
            <button class="action-btn styled" id="retry-btn">Ще раз</button>
            <button class="action-btn styled" id="map-btn">До карти</button>
        </div>
    </div>

</div>

<script type="module" src="../shared/main.js"></script>
<script type="module" src="level.js"></script>
</body>
</html>
